<!doctype html>
<html lang="en">
<head>
  <!-- Etiquetas <meta> obligatorias para Bootstrap -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Enlazando el CSS de Bootstrap -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
  integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">

  <!-- CSS local -->
   <link rel="stylesheet" href="css/app.css">

  <!-- JQuery -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

  <!-- Page Web Icon -->
  <link rel="icon" type="image/png" href="images/favicon.ico" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans&family=Righteous&display=swap" rel="stylesheet">

  <title>AGRO DECPERS</title>

</head>

<body>
  <div class="box-main">
    <nav class="nav-style">
      <a href="https://www.facebook.com/decpers"><img id="logo" src="images/decpers-icon.png" alt=""></a>
      <div class="collapse  navbar-collapse"  id="navbarSupportedContent">         
          <label class="d-flex justify-content-center text-white" style="font-family: 'Kumbh Sans', sans-serif;">
            AGRO-VENTAS         
          </label>
          <label class="d-flex justify-content-center text-white" style="font-family: 'Kumbh Sans', sans-serif;">
            !Apoyando a los agricultores!        
          </label>
      </div>
    </nav>    

    <!-- Código del formulario completo -->   
    <div class="form-style">
      <div class="mt-3 d-flex justify-content-center bg-success text-white">
        <b>
          <label style="margin-top:.5rem;">Calculadora Agrícola
          </label>
        </b> 
      </div>
      <hr>
      <div class="form-bottom">
        <label>Peso Bruto (kg)</label>
        <input type="number" class="form-control" id="inputPesoBruto" 
        placeholder="ingrese peso bruto" disabled="true">

        <label >Peso Camión (kg)</label>
        <input type="number" class="form-control" id="inputPesoCamion" placeholder="ingrese peso camion" disabled="true">

        <label>Libras por saco</label>
        <input type="number" placeholder="ingrese libras" id="inputPesoLibras" maxlength="3" class="form-control mb-3" disabled="true" >
      </div>

      <div class="form-group d-flex justify-content-between" >
        <button id="btnHabilitarCalcular" class="btn btn-success btn-md">Habilitar</button> 
        <button id="limpiarTodo" class=" ml-auto btn btn-warning btn-md">Limpiar</button> 
      </div>
      <hr>
      <div id="cajaSacosCalculados" class="container text-center alert alert-info d-none " role="alert">
      </div>
      <div id="cajaMostrarMonto" class="container text-center alert alert-info d-none" role="alert"> 
      </div>
      <hr>
      <div id="cajaIngresarPrecio" class="price-data d-none">
        <span id="Precio" class="price-title">Ingrese precio</span>
        <input value="0" type="number" id="inputPrecio" maxlength="5" class="form-control">
        <button  id="btnCalcularMonto" class="btn btn-dark">Calcular Monto</button>

      </div>

    </div>

    <footer class="page-footer font-small blue">   
      <!-- Copyright --> 
      <div class="mt-3 footer-copyright text-center py-3">
        © <span id="añoActual"></span> Copyright: 
        <a href="https://www.facebook.com/decpers">Decpers</a> 
      </div> 
      <!-- Copyright -->      
    </footer>

  </div>

  <!-- Libreria para ajustar los decimales-->
  <script src="scripts/decimal.min.js"></script>
  <!--  enlazando el JavaScript de nuestra app -->
  <script type="text/JavaScript" src="scripts/script.js"></script>
 
  <!-- JavaScript de Bootstrap -->
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"
  integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
</body>
</html>
